<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>sshterm — SSH / Telnet / 串口</title>
<link rel="stylesheet" href="/vendor/@xterm/xterm/css/xterm.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <!-- 工具栏 -->
  <div id="toolbar">
    <button id="btn-new" title="新建连接 (Ctrl+N)">＋ 新建连接</button>
    <button id="btn-save" title="保存当前会话配置">💾 保存会话</button>
    <button id="btn-log" title="操作日志">📋 日志</button>
    <button id="btn-sftp" title="SSH 文件浏览/下载 (SFTP)">📁 文件</button>
    <button id="btn-killall" title="断开所有会话" class="danger">⏹ 全部断开</button>
    <button id="btn-lang" title="切换语言">🌐 EN</button>
    <button id="btn-logging" title="开启/关闭接收日志(带时间戳)">📝 日志</button>
    <button id="btn-timer" title="定时发送(串口)">⏱ 定时</button>
    <button id="btn-scan" title="端口扫描/设备发现">🔍 扫描</button>
    <button id="btn-split" title="分屏(当前标签左右分屏)">⊞ 分屏</button>
    <span class="sep"></span>
    <span id="conn-status" class="status-dot idle" title="服务器连接状态"></span>
    <span id="conn-status-text">未连接服务器</span>
    <span class="spacer"></span>
    <span id="srv-addr" class="muted"></span>
  </div>

  <!-- 主区 -->
  <div id="main">
    <!-- 左侧: 会话列表 -->
    <aside id="sidebar">
      <div class="side-head">
        <span>已保存会话</span>
        <span>
          <button id="btn-batch" title="批量管理" class="mini">☑ 批量</button>
          <button id="btn-refresh" title="刷新">⟳</button>
        </span>
      </div>
      <ul id="session-list"></ul>
      <div id="batch-bar" class="hidden">
        <label><input type="checkbox" id="batch-all"> 全选</label>
        <button id="batch-del" class="danger mini"><span id="batch-del-text">删除选中</span>(<span id="batch-n">0</span>)</button>
        <button id="batch-cancel" class="mini">取消</button>
      </div>
      <div class="side-foot muted">双击连接 · 悬停可编辑/删除</div>
    </aside>

    <!-- 右侧: 标签 + 终端 -->
    <div id="workspace">
      <div id="tabbar"></div>
      <div id="search-bar" class="hidden">
        <input id="search-input" placeholder="搜索 (Enter=下一个, Shift+Enter=上一个, Esc=关闭)" autocomplete="off">
        <button id="search-prev" class="mini" title="上一个">▲</button>
        <button id="search-next" class="mini" title="下一个">▼</button>
        <button id="search-close" class="mini" title="关闭">✕</button>
        <span id="search-count" class="muted"></span>
      </div>
      <div id="terms"></div>
      <!-- SFTP 文件面板 (SSH) -->
      <div id="sftp-panel" class="hidden">
        <div class="sftp-head">
          <button id="sftp-up" class="mini" title="上级目录">⬆</button>
          <input id="sftp-path" readonly title="当前目录">
          <button id="sftp-upload" class="mini" title="上传文件到当前目录">⬆️传</button>
          <button id="sftp-upload-dir" class="mini" title="上传整个文件夹(含子目录)">📂传</button>
          <button id="sftp-refresh" class="mini" title="刷新">⟳</button>
          <button id="sftp-close" class="mini" title="关闭面板">✕</button>
        </div>
        <input type="file" id="sftp-file-input" class="hidden">
        <input type="file" id="sftp-dir-input" class="hidden" webkitdirectory>
        <div id="sftp-progress" class="hidden">
          <div id="sftp-progress-bar"><div id="sftp-progress-fill"></div></div>
          <span id="sftp-progress-text"></span>
        </div>
        <div id="sftp-list"></div>
        <div class="sftp-status" id="sftp-status"></div>
      </div>
      <div id="welcome" class="hidden">
        <div class="welcome-box">
          <h1>sshterm</h1>
          <p>SSH · Telnet · 串口 一体化连接工具</p>
          <button id="btn-welcome-new">＋ 新建连接</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 状态栏 -->
  <div id="statusbar">
    <span id="sb-left">就绪</span>
    <span id="sb-right"></span>
  </div>
</div>

<!-- 新建/编辑会话对话框 -->
<div id="dlg-mask" class="hidden">
  <div id="dlg">
    <h3 id="dlg-title">新建连接</h3>
    <div class="form">
      <label>会话名称 <input id="f-name" placeholder="如: 开发板串口"></label>
      <label>类型
        <select id="f-type">
          <option value="ssh">SSH</option>
          <option value="telnet">Telnet</option>
          <option value="serial">串口</option>
        </select>
      </label>

      <!-- SSH 字段 -->
      <div class="grp" id="grp-ssh">
        <label>主机 <input id="f-host" placeholder="192.168.1.100"></label>
        <label>端口 <input id="f-port" type="number" value="22" style="width:90px"></label>
        <label>用户名 <input id="f-user" placeholder="root"></label>
        <label>认证方式
          <select id="f-auth">
            <option value="password">密码</option>
            <option value="key">密钥</option>
          </select>
        </label>
        <label id="f-pwd-wrap">密码 <input id="f-password" type="password" placeholder="密码"></label>
        <label id="f-key-wrap" class="hidden">私钥路径 <input id="f-key" placeholder="C:\Users\xxx\.ssh\id_rsa"></label>
        <label id="f-pass-wrap" class="hidden">密钥口令 <input id="f-passphrase" type="password" placeholder="可选"></label>
        <label>代理
          <select id="f-proxy-type">
            <option value="">无代理</option>
            <option value="socks5">SOCKS5</option>
            <option value="http">HTTP CONNECT</option>
          </select>
        </label>
        <label id="f-proxy-wrap" class="hidden">代理地址 <input id="f-proxy-host" placeholder="127.0.0.1" style="width:140px">
          <input id="f-proxy-port" type="number" placeholder="1080" style="width:80px"></label>
      </div>

      <!-- Telnet 字段 -->
      <div class="grp hidden" id="grp-telnet">
        <label>主机 <input id="t-host" placeholder="192.168.1.100"></label>
        <label>端口 <input id="t-port" type="number" value="23" style="width:90px"></label>
        <label><input type="checkbox" id="t-autologin"> 自动登录</label>
        <label id="t-user-wrap" class="hidden">用户名 <input id="t-user"></label>
        <label id="t-pass-wrap2" class="hidden">密码 <input id="t-pass" type="password"></label>
      </div>

      <!-- 串口字段 -->
      <div class="grp hidden" id="grp-serial">
        <label>端口
          <select id="s-port"><option value="">(加载中…)</option></select>
          <button id="s-refresh" class="mini" title="刷新串口列表">⟳</button>
        </label>
        <label>波特率
          <select id="s-baud">
            <option>9600</option><option>19200</option><option>38400</option>
            <option>57600</option><option selected>115200</option>
            <option>230400</option><option>460800</option><option>921600</option>
          </select>
        </label>
        <label>数据位 <select id="s-data"><option>8</option><option>7</option><option>6</option><option>5</option></select></label>
        <label>停止位 <select id="s-stop"><option>1</option><option>2</option></select></label>
        <label>校验位 <select id="s-parity"><option value="none">None</option><option value="even">Even</option><option value="odd">Odd</option></select></label>
        <label><input type="checkbox" id="s-hex"> HEX 显示/发送</label>
      </div>
    </div>
    <div class="dlg-actions">
      <button id="btn-dlg-conn" class="primary">连接</button>
      <button id="btn-dlg-save">保存并连接</button>
      <button id="btn-dlg-cancel">取消</button>
    </div>
  </div>
</div>

<!-- 关闭会话确认对话框 -->
<div id="dlg-close-mask" class="hidden">
  <div id="dlg-close">
    <h3>⚠️ 关闭会话?</h3>
    <p id="close-info"></p>
    <div class="dlg-actions">
      <button id="btn-close-ok" class="danger">确认关闭</button>
      <button id="btn-close-cancel">取消</button>
    </div>
  </div>
</div>

<!-- 端口扫描对话框 -->
<div id="dlg-scan-mask" class="hidden">
  <div id="dlg-scan">
    <h3>🔍 端口扫描</h3>
    <div class="form">
      <label>目标主机 <input id="scan-host" placeholder="192.168.1.100"></label>
      <label>端口 <input id="scan-ports" placeholder="22,23,80,443,8080,3389,5555"></label>
    </div>
    <div class="dlg-actions">
      <button id="btn-scan-start" class="primary">扫描</button>
      <button id="btn-scan-close">关闭</button>
    </div>
    <div id="scan-result"></div>
  </div>
</div>

<!-- 定时发送对话框 -->
<div id="dlg-timer-mask" class="hidden">
  <div id="dlg-timer">
    <h3>⏱ 定时发送</h3>
    <div class="form">
      <label>发送内容 <input id="tm-content" placeholder="要定时发送的内容"></label>
      <label>周期(毫秒) <input id="tm-interval" type="number" value="1000" min="100"></label>
      <label><input type="checkbox" id="tm-hex"> 按 HEX 发送</label>
      <label><input type="checkbox" id="tm-auto"> 立即开始</label>
    </div>
    <div class="dlg-actions">
      <button id="btn-tm-start" class="primary">开始</button>
      <button id="btn-tm-stop">停止</button>
      <button id="btn-tm-cancel">取消</button>
    </div>
  </div>
</div>

<!-- 操作日志对话框 -->
<div id="dlg-log-mask" class="hidden">
  <div id="dlg-log">
    <h3>📋 操作日志 <button id="log-close" class="mini" style="float:right">✕</button></h3>
    <div id="log-list"></div>
    <div class="log-foot muted">日志同时写入 %USERPROFILE%\.sshterm\sshterm.log</div>
  </div>
</div>

<script src="/vendor/@xterm/xterm/lib/xterm.js"></script>
<script src="/vendor/@xterm/addon-fit/lib/addon-fit.js"></script>
<script src="/vendor/@xterm/addon-search/lib/addon-search.js"></script>
<script src="/app.js"></script>
</body>
</html>
