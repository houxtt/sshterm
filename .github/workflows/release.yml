name: Release build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (must match package.json before publishing)
        required: true
        type: string

permissions:
  contents: write

env:
  SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
  SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
  SSHTERM_TEST_HTTP: '1'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check release version
        shell: pwsh
        run: |
          $actual = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($actual -ne '${{ inputs.version }}') { throw "package.json version $actual does not match ${{ inputs.version }}" }
      - run: npm run check
      - run: npm run test:workspace-security
      - run: node tests/desktop_contract.js
      - run: npm run build:exe
      - run: npm run test:package
      - run: npm run test:installer
      - name: Determine signing mode
        id: signing
        shell: pwsh
        run: |
          $hasCert = -not [string]::IsNullOrWhiteSpace($env:SIGNING_CERT_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:SIGNING_CERT_PASSWORD)
          if ($hasCert -ne $hasPassword) { throw 'Configure both signing secrets or neither of them.' }
          $mode = if ($hasCert) { 'signed' } else { 'unsigned' }
          "mode=$mode" >> $env:GITHUB_OUTPUT
      - name: Sign and verify Authenticode artifact
        if: steps.signing.outputs.mode == 'signed'
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'sshterm-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_CERT_BASE64))
          try {
            $signtool = (Get-Command signtool.exe -ErrorAction Stop).Source
            foreach ($artifact in @('dist/sshterm.exe', 'dist/sshterm-setup.exe')) {
              & $signtool sign /fd SHA256 /f $pfx /p $env:SIGNING_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $artifact
              if ($LASTEXITCODE -ne 0) { throw "signtool sign failed for $artifact : $LASTEXITCODE" }
              & $signtool verify /pa /all $artifact
              if ($LASTEXITCODE -ne 0) { throw "signtool verify failed for $artifact : $LASTEXITCODE" }
            }
          } finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: sshterm-${{ inputs.version }}-${{ steps.signing.outputs.mode }}
          path: |
            dist/sshterm.exe
            dist/sshterm-setup.exe
          if-no-files-found: error
      - name: Publish v2 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $notesSource = "docs/RELEASE-NOTES-v${{ inputs.version }}.md"
          if (-not (Test-Path $notesSource)) { throw "Missing release notes: $notesSource" }
          Copy-Item $notesSource $notes
          if ('${{ steps.signing.outputs.mode }}' -eq 'unsigned') {
            Add-Content $notes "`n此版本 EXE 未进行代码签名；Windows 首次运行时可能显示安全提示。`n"
          }
          gh release create "v${{ inputs.version }}" dist/sshterm-setup.exe dist/sshterm.exe --target "${{ github.sha }}" --title "sshterm v${{ inputs.version }}" --notes-file $notes
